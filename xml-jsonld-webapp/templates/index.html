<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XML to JSON-LD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>XML to JSON-LD</h1>
        <p>Upload an XML file. The app will convert it to a basic JSON-LD skeleton and return it as a download.</p>
        <form method="post" enctype="multipart/form-data">
          <label for="xml_file">XML file</label>
          <input id="xml_file" name="xml_file" type="file" accept=".xml,application/xml,text/xml" required>
          <button type="submit">Convert and download</button>
        </form>
        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}
      </section>
    </main>
  </body>
</html>
