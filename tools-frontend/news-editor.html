<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor novinek OFN</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#14211c;background:#f4f1e9}*{box-sizing:border-box}body{margin:0;padding:40px 20px}main{max-width:700px;margin:auto}h1{margin:0 0 8px;font-size:36px}p{color:#66716c;line-height:1.5}form{margin-top:28px;padding:28px;border:1px solid #d9ddd6;border-radius:16px;background:#fffdf8;box-shadow:0 15px 40px #192d2414}label{display:block;margin:18px 0 7px;font-weight:650;font-size:13px}input,textarea{width:100%;padding:12px;border:1px solid #bdc6bf;border-radius:8px;background:white;color:inherit;font:inherit}textarea{min-height:105px;resize:vertical}small{display:block;margin-top:6px;color:#7c847f}button{margin-top:22px;padding:13px 18px;border:0;border-radius:9px;background:#0e4e3b;color:white;font-weight:700;cursor:pointer}button:hover{background:#176b52}pre{display:none;overflow:auto;margin-top:20px;padding:18px;border-radius:10px;background:#14211c;color:#d9ed9d;white-space:pre-wrap}.message{color:#176b52;font-weight:650}
  </style>
</head>
<body>
  <main>
    <h1>Editor novinek</h1>
    <p>Vytvořte záznam o změně bez spuštění aplikace Workbench. Identifikátor a datum zveřejnění se vygenerují automaticky podle vašeho místního času.</p>
    <form id="editor">
      <label for="title">Název</label>
      <input id="title" required maxlength="100" placeholder="Vylepšená validace datových sad">
      <label for="summary">Shrnutí</label>
      <textarea id="summary" required maxlength="500" placeholder="Popište změnu z pohledu uživatele."></textarea>
      <label for="details">Podrobnosti</label>
      <textarea id="details" placeholder="Jeden volitelný bod na řádek"></textarea>
      <small>Prázdné řádky budou ignorovány.</small>
      <button type="submit">Stáhnout záznam JSON</button>
      <p class="message" id="message" role="status"></p>
      <pre id="preview"></pre>
    </form>
  </main>
  <script>
    const form = document.querySelector('#editor');
    const preview = document.querySelector('#preview');
    const message = document.querySelector('#message');

    function localDate() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now - offset).toISOString().slice(0, 10);
    }

    function slugify(value) {
      return value.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'update';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const title = document.querySelector('#title').value.trim();
      const date = localDate();
      const entry = {
        id: `${date}-${slugify(title)}`,
        publishedAt: date,
        title,
        summary: document.querySelector('#summary').value.trim(),
        details: document.querySelector('#details').value.split('\n').map((line) => line.trim()).filter(Boolean)
      };
      const json = `${JSON.stringify(entry, null, 2)}\n`;
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const link = Object.assign(document.createElement('a'), { href: url, download: `${entry.id}.json` });
      document.body.append(link); link.click(); link.remove(); URL.revokeObjectURL(url);
      preview.textContent = json; preview.style.display = 'block';
      message.textContent = `Soubor ${entry.id}.json byl stažen – přesuňte ho do složky news a zahrňte ho do commitu se svou změnou.`;
    });
  </script>
</body>
</html>
